<style>
        body {
            background-color: #000000;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        .hairline-border {
            border-width: 0.5px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="flex flex-col min-h-screen">
<!-- Top Navigation -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-side h-14 bg-background/80 backdrop-blur-md border-b border-outline-variant/30">
<span class="font-wordmark text-wordmark text-on-surface tracking-tight">Boyfriend Camera</span>
<button class="material-symbols-outlined text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform" data-icon="settings">
            settings
        </button>
</header>
<!-- Main Content (Empty State) -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-side pt-14 pb-32">
<div class="flex flex-col items-center text-center space-y-4">
<!-- Icon -->
<div class="mb-2">
<span class="material-symbols-outlined text-[40px] text-secondary/80 font-extralight" data-icon="add_photo_alternate">
                    add_photo_alternate
                </span>
</div>
<!-- Headline -->
<h1 class="font-screen-title text-screen-title text-on-surface font-medium">Add reference photos</h1>
<!-- Subtext -->
<p class="font-body text-value-mono text-secondary/60 max-w-[260px]">
                Save shots from Pinterest or Instagram to your camera roll, then import them here.
            </p>
</div>
<!-- Atmospheric Glass Element (Visual Decoration) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden flex items-center justify-center">
<div class="w-[300px] h-[300px] bg-secondary/5 blur-[120px] rounded-full"></div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 flex flex-col bg-surface-container-low border-t-[0.5px] border-outline-variant pb-safe-area-bottom">
<div class="flex items-center justify-between px-margin-side h-16 relative">
<!-- Add Photos Action (Left) -->
<button class="flex flex-col items-center justify-center space-y-1 group active:scale-95 transition-transform">
<div class="w-10 h-10 flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined text-[24px]" data-icon="add">add</span>
</div>
<span class="font-micro text-micro text-on-surface-variant tracking-wide">Add Photos</span>
</button>
<!-- Start Shooting Button (Center) -->
<div class="absolute left-1/2 -translate-x-1/2">
<button class="flex items-center justify-center bg-secondary-container/40 text-on-secondary-container rounded-full px-8 py-3 opacity-50 cursor-not-allowed" disabled="">
<span class="material-symbols-outlined mr-2" data-icon="photo_camera">photo_camera</span>
<span class="font-cta text-cta">Start Shooting</span>
</button>
</div>
<!-- Empty space for layout balance if needed, or trailing icon -->
<div class="w-10"></div>
</div>
</nav>
<!-- Interaction Script -->
<script>
        // Simple micro-interaction for the settings icon
        const settingsBtn = document.querySelector('[data-icon="settings"]');
        settingsBtn.addEventListener('click', () => {
            console.log('Settings triggered');
        });

        // Add photo logic placeholder
        const addBtn = document.querySelector('button .material-symbols-outlined[data-icon="add"]').parentElement;
        addBtn.addEventListener('click', () => {
            // Simulated haptic feedback
            if (window.navigator.vibrate) window.navigator.vibrate(5);
            console.log('Open photo picker');
        });
    </script>
</body></html>
