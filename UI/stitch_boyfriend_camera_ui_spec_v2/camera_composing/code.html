<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const shutterBtn = document.querySelector('.shutter-btn');
            
            shutterBtn.addEventListener('click', () => {
                // Subtle haptic feel through flash
                const flash = document.createElement('div');
                flash.className = 'fixed inset-0 bg-white z-[100] pointer-events-none opacity-0';
                document.body.appendChild(flash);
                
                // Animation timeline
                flash.animate([
                    { opacity: 0 },
                    { opacity: 0.4 },
                    { opacity: 0 }
                ], {
                    duration: 150,
                    easing: 'ease-out'
                });

                setTimeout(() => flash.remove(), 200);
            });

            // Smooth scroll for thumbnails
            const strip = document.querySelector('.overflow-x-auto');
            strip.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0) {
                    e.preventDefault();
                    strip.scrollLeft += e.deltaY;
                }
            });
        });
    </script>
