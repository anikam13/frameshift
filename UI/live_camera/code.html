<style>
        body {
            background-color: #000;
            overflow: hidden;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .viewfinder-grid {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.15) 1px, transparent 1px);
            background-size: 33.33% 33.33%;
        }

        .level-indicator-active {
            filter: drop-shadow(0 0 8px #5856D6);
        }

        .shutter-glow {
            box-shadow: 0 0 20px rgba(88, 86, 214, 0.4);
        }

        .glass-morphic {
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.4);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes pulse-focus {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .focus-square {
            border: 1px solid #5856D6;
            animation: pulse-focus 2s infinite ease-in-out;
        }

        .haptic-scale:active {
            transform: scale(0.92);
            transition: transform 0.1s ease-out;
        }
    </style>

<script>
        // Micro-interactions and Level Indicator Logic
        const levelLeft = document.getElementById('level-left');
        const levelRight = document.getElementById('level-right');
        const shutterBtn = document.getElementById('shutter-btn');
        
        let targetRotation = 0;
        let currentRotation = 0;

        // Simulate level movement
        function updateLevel() {
            // Add a bit of natural jitter and slow oscillation
            targetRotation = Math.sin(Date.now() / 1500) * 2;
            
            // Smoothly interpolate current rotation to target
            currentRotation += (targetRotation - currentRotation) * 0.1;
            
            levelLeft.style.transform = `rotate(${currentRotation}deg)`;
            levelRight.style.transform = `rotate(${-currentRotation}deg)`;

            // Haptic Feedback Visualization: If leveled (close to 0), turn green/indigo
            if (Math.abs(currentRotation) < 0.2) {
                levelLeft.classList.add('bg-action-indigo', 'level-indicator-active');
                levelRight.classList.add('bg-action-indigo', 'level-indicator-active');
                levelLeft.classList.remove('bg-white');
                levelRight.classList.remove('bg-white');
            } else {
                levelLeft.classList.remove('bg-action-indigo', 'level-indicator-active');
                levelRight.classList.remove('bg-action-indigo', 'level-indicator-active');
                levelLeft.classList.add('bg-white');
                levelRight.classList.add('bg-white');
            }

            requestAnimationFrame(updateLevel);
        }

        updateLevel();

        // Shutter Button Interaction
        shutterBtn.addEventListener('click', () => {
            // Flash effect
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[100] pointer-events-none transition-opacity duration-300 opacity-100';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 300);
            }, 50);

            // Shutter sound / haptic visual feedback
            shutterBtn.classList.add('scale-90');
            setTimeout(() => shutterBtn.classList.remove('scale-90'), 150);
        });

        // Add haptic-feedback CSS class support through active states defined in Tailwind config
        document.querySelectorAll('.haptic-scale').forEach(el => {
            el.addEventListener('touchstart', () => {
                el.style.transform = 'scale(0.92)';
            });
            el.addEventListener('touchend', () => {
                el.style.transform = 'scale(1)';
            });
        });
    </script>
