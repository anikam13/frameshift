<!-- Micro-interactions Script -->
<script>
        // Handle filter button selection
        const filterButtons = document.querySelectorAll('.px-5.py-2.rounded-full');
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => {
                    b.classList.remove('bg-action-indigo', 'text-white');
                    b.classList.add('bg-surface-container', 'text-on-surface-variant');
                });
                btn.classList.add('bg-action-indigo', 'text-white');
                btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
            });
        });

        // Simple haptic-like scale effect on click for grid items
        const gridItems = document.querySelectorAll('.masonry-item');
        gridItems.forEach(item => {
            item.addEventListener('touchstart', () => item.classList.add('scale-95'));
            item.addEventListener('touchend', () => item.classList.remove('scale-95'));
        });
    </script>
