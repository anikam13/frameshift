<body class="flex flex-col min-h-screen text-on-surface">
<!-- TopAppBar (From JSON) -->

<!-- Content Canvas -->

</div>
<!-- Before/After Comparison Card -->
<div class="relative group mx-auto w-full max-w-md overflow-hidden rounded-2xl shadow-2xl transition-all duration-500 bg-camera-black" id="previewContainer">
<!-- Grid Layout for Side-by-Side -->
<div class="viewfinder-preview flex overflow-hidden" id="previewGrid">
<!-- Reference Photo -->

<span class="px-2 py-0.5 bg-black/40 backdrop-blur-md text-white font-label-caps text-[10px] rounded border border-white/20">REFERENCE</span>

<!-- BottomNavBar (Suppressed for transactional screen logic, but referenced for system consistency) -->
<!-- Navigation suppressed because this is a Task-Focused Export sub-page -->
<!-- Micro-interactions Script -->
<script>
        function setFormat(type) {
            const container = document.getElementById('previewGrid');
            const btnStory = document.getElementById('formatStory');
            const btnSquare = document.getElementById('formatSquare');

            if (type === 'square') {
                container.classList.add('square');
                btnSquare.classList.add('bg-action-indigo', 'text-white', 'border-transparent');
                btnSquare.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant', 'border-outline-variant');
                btnStory.classList.remove('bg-action-indigo', 'text-white', 'border-transparent');
                btnStory.classList.add('bg-white', 'text-on-surface-variant', 'border-outline-variant');
            } else {
                container.classList.remove('square');
                btnStory.classList.add('bg-action-indigo', 'text-white', 'border-transparent');
                btnStory.classList.remove('bg-white', 'text-on-surface-variant', 'border-outline-variant');
                btnSquare.classList.remove('bg-action-indigo', 'text-white', 'border-transparent');
                btnSquare.classList.add('bg-surface-container-lowest', 'text-on-surface-variant', 'border-outline-variant');
            }
        }

        // Celebrate on load
        window.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            for(let i=0; i<12; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'celebration-sparkle text-premium-gold material-symbols-outlined';
                sparkle.innerText = 'auto_awesome';
                sparkle.style.left = Math.random() * 80 + 10 + '%';
                sparkle.style.top = Math.random() * 40 + 10 + '%';
                sparkle.style.fontSize = (Math.random() * 20 + 10) + 'px';
                sparkle.style.opacity = '0';
                sparkle.style.transition = 'all 1s ease-out';
                main.appendChild(sparkle);
                
                setTimeout(() => {
                    sparkle.style.opacity = '1';
                    sparkle.style.transform = `translateY(-${Math.random() * 50 + 20}px) scale(1.5)`;
                    setTimeout(() => {
                        sparkle.style.opacity = '0';
                    }, 800);
                }, i * 150);
            }
        });
    </script>
